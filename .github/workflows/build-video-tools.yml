name: Build Video Tools APK

# Scoped to the dedicated build branch only — never runs on main.
on:
  push:
    branches:
      - video-tools-build
    paths:
      - 'video-tools-app/**'
      - '.github/workflows/build-video-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: video-tools-build
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: video-tools-app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Lint (non-blocking)
        working-directory: video-tools-app
        continue-on-error: true
        run: ./gradlew :app:lintDebug

      - name: Commit APK back to build branch
        run: |
          mkdir -p video-tools-app/build-output
          cp video-tools-app/app/build/outputs/apk/debug/app-debug.apk video-tools-app/build-output/VideoTools-v1.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video-tools-app/build-output/VideoTools-v1.apk
          git commit -m "CI: built VideoTools-v1.apk ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push origin video-tools-build

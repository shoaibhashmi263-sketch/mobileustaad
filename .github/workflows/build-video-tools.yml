name: Build Video Tools APK

# Scoped to the dedicated build branch only — never runs on main.
on:
  push:
    branches:
      - video-tools-build
    paths:
      - 'video-tools-app/**'
      - '.github/workflows/build-video-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: video-tools-build
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: android-actions/setup-android@v3 failed on run 41328896780
      # (2026-11-01, 20s, all later steps skipped). The ubuntu-latest runner
      # image already ships an Android SDK with sdkmanager, so use it directly.
      - name: Accept licenses and install platform 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "Using sdkmanager: $SDKMANAGER (ANDROID_HOME=$ANDROID_HOME)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: video-tools-app
        run: |
          chmod +x gradlew
          mkdir -p build-output
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-output/build-log.txt

      # Run/job logs need repo admin to download via the API, so on failure
      # commit the Gradle log to the branch where it can be fetched via git.
      - name: Commit build log on failure
        if: failure()
        run: |
          tail -n 4000 video-tools-app/build-output/build-log.txt > /tmp/bl.txt 2>/dev/null || echo "no build log captured" > /tmp/bl.txt
          cp /tmp/bl.txt video-tools-app/build-output/build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f video-tools-app/build-output/build-log.txt
          git commit -m "CI: failed build log ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || echo "nothing to commit"
          git push origin video-tools-build

      - name: Lint (non-blocking)
        working-directory: video-tools-app
        continue-on-error: true
        run: ./gradlew :app:lintDebug

      - name: Commit APK back to build branch
        run: |
          mkdir -p video-tools-app/build-output
          cp video-tools-app/app/build/outputs/apk/debug/app-debug.apk video-tools-app/build-output/VideoTools-v1.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video-tools-app/build-output/VideoTools-v1.apk
          git commit -m "CI: built VideoTools-v1.apk ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push origin video-tools-build

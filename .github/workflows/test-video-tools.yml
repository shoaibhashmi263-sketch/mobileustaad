name: Test Video Tools in emulator

# Scoped to the dedicated build branch only — never runs on main.
# Round 3: manual emulator management on ubuntu-latest (KVM available),
# after reactivecircus/android-emulator-runner failed twice on macos-14
# in the boot phase before the test script ever started (no admin access
# to job logs, so every phase now writes evidence into test-output/).
on:
  push:
    branches:
      - video-tools-build
    paths:
      - 'video-tools-app/ci-test/**'
      - '.github/workflows/test-video-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: video-tools-build
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Accept licenses and install SDK + emulator + system image
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "Using sdkmanager: $SDKMANAGER (ANDROID_HOME=$ANDROID_HOME)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" \
            "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64"

      - name: Build debug APK (same source as VideoTools-v2.apk / v1.1)
        working-directory: video-tools-app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Boot emulator and run end-to-end tests
        run: bash video-tools-app/ci-test/ci-main.sh

      # Run/job logs need repo admin via the API, so commit evidence back to
      # the branch where it can be fetched via git (same pattern as builds).
      # Race-proof: sync to the latest remote tip before committing, and
      # never fail on missing output — write a fallback marker instead.
      - name: Commit test output back to build branch
        if: always()
        run: |
          mkdir -p /tmp/vt-test-output
          cp -r video-tools-app/test-output/. /tmp/vt-test-output/ 2>/dev/null || true
          git fetch origin video-tools-build
          git reset --hard origin/video-tools-build
          mkdir -p video-tools-app/test-output
          cp -r /tmp/vt-test-output/. video-tools-app/test-output/ 2>/dev/null || true
          if [ ! -f video-tools-app/test-output/results.txt ]; then
            echo "NO RESULTS FILE — the test script did not run (emulator step failed before script start)." > video-tools-app/test-output/results.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f video-tools-app/test-output
          git commit -m "CI: emulator test output ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || echo "nothing to commit"
          git push origin video-tools-build
